name: Supabase Keep Alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          set -euo pipefail

          SUPABASE_URL="https://vkgiosqveadbrrwtskgh.supabase.co"

          echo "开始访问 Supabase..."
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            "${SUPABASE_URL}/auth/v1/health"

          echo
          echo "Supabase 请求成功"
