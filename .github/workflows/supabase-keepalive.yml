名称: Supabase Keep Alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

职位:
  keep-alive:
    运行于: ubuntu-latest

    步骤:
      - 名称: Ping Supabase
        运行: |
          set -euo pipefail

          URL="https://vkgiosqveadbrrwtskgh.supabase.co/auth/v1/health"

          echo "开始访问 Supabase..."
          curl \
            --fail-with-body \
            --静默
            --显示错误 \
            --max-time 30 \
            "$URL"

          回显
          echo "Supabase 请求成功"
