name: Supabase Keep Alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-24.04

    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: https://vkgiosqveadbrrwtskgh.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          test -n "${SUPABASE_ANON_KEY:-}" || {
            echo "错误：没有配置 SUPABASE_ANON_KEY"
            exit 1
          }

          echo "开始查询 exam_user_learning_state..."

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/exam_user_learning_state?select=updated_at&limit=1"

          echo
          echo "数据库查询成功"
